name: Deploy portfolio site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Needed to push the built site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Publish site/out as the entire contents of the gh-pages branch. The
      # branch is generated output with no history worth keeping, so each
      # deploy replaces it outright.
      - name: Publish to gh-pages
        working-directory: site/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f index.html || { echo "::error::build produced no index.html"; exit 1; }
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published $(find . -name '*.html' | wc -l) HTML files to gh-pages"
